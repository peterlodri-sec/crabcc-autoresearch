version: '3'

vars:
  RUN_ID:
    sh: echo "${RUN_ID:-crabcc-run-$(date +%Y%m%d-%H%M)}"
  # Maximum wall-clock hours. Slots are terminated at the deadline and
  # artifacts are published automatically. Supported values: 6, 8, 10.
  RUN_HOURS:
    sh: echo "${RUN_HOURS:-8}"

tasks:
  prepare:
    desc: One-time tokenizer build (run before first loop)
    cmds:
      - uv run python prepare.py

  run:
    desc: |
      Run two autoresearch slots in parallel (lambda + charlm) under a single LangSmith trace.
      Required env: RUN_ID, CRABCC_RECEIVER_URL, OPENROUTER_API_KEY, GITHUB_TOKEN
      Optional env: BUDGET_USD, PROVIDER, RUN_HOURS (default 8), LANGSMITH_API_KEY
                    VAST_INSTANCE_ID + VASTAI_API_KEY (enables auto-destroy after publish)
    vars:
      GPU_TYPE:
        sh: command -v nvidia-smi &>/dev/null && nvidia-smi --query-gpu=name --format=csv,noheader | head -1 | tr -d '\r\n' || echo "unknown"
      GPU_COUNT:
        sh: command -v nvidia-smi &>/dev/null && nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d ' ' || echo "1"
    cmds:
      - echo "Starting run {{.RUN_ID}} on {{.GPU_COUNT}}x {{.GPU_TYPE}} — limit {{.RUN_HOURS}}h (${PROVIDER:-unknown})"
      # Register both slot run_ids with the receiver
      - |
        uv run python -c "
        from telemetry import report_start
        base = '{{.RUN_ID}}'
        for slot in ('lambda', 'charlm'):
            report_start(
                run_id=f'{base}-{slot}',
                machine_type='{{.GPU_COUNT}}x {{.GPU_TYPE}}',
                gpu_type='{{.GPU_TYPE}}',
                provider='${PROVIDER:-unknown}',
                budget_usd=float('${BUDGET_USD:-0}') / 2,
            )
        "
      # Launch both slots in parallel — agent.py enforces the RUN_HOURS deadline
      - |
        RUN_ID={{.RUN_ID}} \
        GPU_TYPE="{{.GPU_TYPE}}" \
        PROVIDER="${PROVIDER:-unknown}" \
        BUDGET_USD="${BUDGET_USD:-0}" \
        RUN_HOURS={{.RUN_HOURS}} \
        uv run python agent.py
      # Seal both slot runs
      - |
        uv run python -c "
        from telemetry import report_end
        base = '{{.RUN_ID}}'
        for slot in ('lambda', 'charlm'):
            report_end(run_id=f'{base}-{slot}', total_cost_usd=float('${TOTAL_COST_USD:-0}') / 2)
        "
      # Publish artifacts (both slots)
      - task: publish
        vars:
          RUN_ID: "{{.RUN_ID}}"
          GPU_TYPE: "{{.GPU_TYPE}}"
      # Auto-destroy Vast.ai instance if credentials were provided
      - |
        if [ -n "${VAST_INSTANCE_ID:-}" ] && [ -n "${VASTAI_API_KEY:-}" ]; then
          echo "Destroying instance ${VAST_INSTANCE_ID}..."
          curl -sf -X DELETE \
            "https://console.vast.ai/api/v0/instances/${VAST_INSTANCE_ID}/?api_key=${VASTAI_API_KEY}" \
            -o /dev/null && echo "Instance destroyed — billing stopped." \
            || echo "Warning: destroy call failed — check vast.ai console." >&2
        fi

  run-single:
    desc: Run a single slot (SLOT=lambda or SLOT=charlm). Useful for debugging.
    vars:
      GPU_TYPE:
        sh: command -v nvidia-smi &>/dev/null && nvidia-smi --query-gpu=name --format=csv,noheader | head -1 | tr -d '\r\n' || echo "unknown"
    cmds:
      - |
        RUN_ID={{.RUN_ID}} \
        GPU_TYPE="{{.GPU_TYPE}}" \
        PROVIDER="${PROVIDER:-unknown}" \
        BUDGET_USD="${BUDGET_USD:-0}" \
        RUN_HOURS={{.RUN_HOURS}} \
        uv run python -c "
        import agent, os
        agent.run(
            base_run_id=os.environ['RUN_ID'],
            gpu_type=os.environ.get('GPU_TYPE', ''),
            provider=os.environ.get('PROVIDER', ''),
            budget_usd=float(os.environ.get('BUDGET_USD', '0')),
            run_hours=float(os.environ.get('RUN_HOURS', '8')),
            slots=['${SLOT:-lambda}'],
        )
        "

  publish:
    desc: Push all slot artifacts to peterlodri-sec/lambda-normalization-census (set GITHUB_TOKEN)
    vars:
      GPU_TYPE:
        sh: command -v nvidia-smi &>/dev/null && nvidia-smi --query-gpu=name --format=csv,noheader | head -1 | tr -d '\r\n' || echo "unknown"
    cmds:
      - |
        RUN_ID={{.RUN_ID}} \
        GPU_TYPE="{{.GPU_TYPE}}" \
        PROVIDER="${PROVIDER:-unknown}" \
        BUDGET_USD="${BUDGET_USD:-0}" \
        TOTAL_COST_USD="${TOTAL_COST_USD:-0}" \
        uv run python push_dataset.py

  test:
    desc: Run worker unit tests
    cmds:
      - uv run pytest -v
